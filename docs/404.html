<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>跳轉中...</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #fafafa;
    }
    .message {
      text-align: center;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="message" id="message">
    <h2>正在尋找目標網址，請稍候...</h2>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-zZPCI9kLiW7JbQ6gz10ey1b4f1d1EQlAVSd6zdC2DrAszbELQReOC93nND2WnF7S/exec';
    
    // 1. 取得 pathname 並去除開頭斜線
    let rawPath = window.location.pathname.substring(1);
    
    // 2. 解碼 (將 %E6%B8%AC 這種格式轉回真實的中文)
    let path = decodeURIComponent(rawPath);
    
    // 3. 過濾不合法字元 (保留英數、底線、減號、繁簡中文)
    path = path.replace(/[^a-zA-Z0-9-_\u4e00-\u9fa5]/g, '');

    const para = window.location.search;
    const messageDiv = document.getElementById('message');
    
    console.log("解析後的 Path:", path, "參數:", para);
    document.title = path; 

    if (path) {
      // 這裡再次 encodeURIComponent 是為了透過 HTTP GET 傳輸，GAS 端會自動解碼
      fetch(`${GAS_URL}?path=${encodeURIComponent(path)}`)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'success' && data.url) {
            console.log("找到目標網址:", data.url);
            let targetUrl = data.url + para; 
            console.log("準備跳轉至:", targetUrl);
            window.location.replace(targetUrl);
          } else {
            messageDiv.innerHTML = `<h2>找不到此連結 (404)</h2><p>您輸入的代碼 <b>${path}</b> 不存在。</p><a href="/">回首頁新增</a>`;
            window.location.replace("https://freepacman.org/");
          }
        })
        .catch(error => {
          console.error("Fetch Error:", error);
          messageDiv.innerHTML = '<h2>系統連線異常</h2><p>無法連線至資料庫，請稍後再試。</p>';
          window.location.replace("https://freepacman.org/");
        });
    } else {
      window.location.replace('/');
    }
  </script>
</body>
</html>
