<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>Go!</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #000000;
      color: white;
    }
    .message {
      text-align: center;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="message" id="message">
    <h2 id="flow">Going</h2>
  </div>

  <script src="s.js" defer></script>
  <script>
    document.addEventListener("DOMContentLoaded", function() {
        const flowElement = document.getElementById("flow");
        let dotCount = 1;

        setInterval(() => {
            dotCount = dotCount >= 10 ? 1 : dotCount + 1;
            flowElement.textContent = "Going" + ".".repeat(dotCount);
        }, 200);
    });
  </script>
</body>
</html>
