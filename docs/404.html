<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <title>跳轉中...</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: sans-serif;
      background-color: #000000;
      color: white;
    }
    .message {
      text-align: center;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="message" id="message">
    <h2>正在尋找目標網址，請稍候...</h2>
  </div>

  <script>
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbx-zZPCI9kLiW7JbQ6gz10ey1b4f1d1EQlAVSd6zdC2DrAszbELQReOC93nND2WnF7S/exec';
    
    let test = 99; // 1:test, 99:run
    
    // 1. 取得 pathname 並去除開頭斜線
    let rawPath;
    if( test === 1 ) rawPath = "yNote"; //window.location.hash.slice(1); // for test, use #
    else rawPath = window.location.pathname.substring(1); 
    
    // 2. 解碼 (將 %E6%B8%AC 這種格式轉回真實的中文)
    let path = decodeURIComponent(rawPath);
    if( test === 1 ) console.log("org path", path);
    
    // 3. 過濾不合法字元 (保留英數、底線、減號、繁簡中文)
    //path = path.replace(/[^a-zA-Z0-9-_\u4e00-\u9fa5]/g, '');
    if( test === 1 ) console.log("final path", path);

    // 取得查詢參數 (例如 ?id=123)
    const para = window.location.search;
    
    // 【新增】取得 hash (例如 #test=tt)。為了不干擾您的 test=1 測試模式，限定 test===99 時才抓取
    const hashPart =  window.location.hash;

    const messageDiv = document.getElementById('message');
    
    if( test === 1 ) console.log("解析後的 Path:", path, "參數:", para, "Hash:", hashPart);
    document.title = path; 

    if (path) {
      // 這裡再次 encodeURIComponent 是為了透過 HTTP GET 傳輸，GAS 端會自動解碼
      fetch(`${GAS_URL}?path=${encodeURIComponent(path)}`)
        .then(response => response.json())
        .then(data => {
          if (data.status === 'success' && data.url) {
            if(test !== 99) console.log("找到目標網址:", data.url);
            
            // 【修改】將參數 (?xxx) 與 hash (#xxx) 依序接在目標網址後方
            let targetUrl = data.url + para + hashPart; 
            
            if( test === 1 ) console.log("準備跳轉至:", targetUrl);
            if(test === 99) window.location.replace(targetUrl);
          } else {
            if( test === 1 ) console.log("找不到目標網址");
            if(test === 99) window.location.replace("https://freepacman.org/");
          }
        })
        .catch(error => {
          if( test === 1 ) console.log("Fetch Error:", error);
          if(test === 99) window.location.replace("https://freepacman.org/");
        });
    } else {
      if( test === 1 ) console.log("no path");
      if(test === 99) window.location.replace('/'); 
    }
  </script>
</body>
</html>
